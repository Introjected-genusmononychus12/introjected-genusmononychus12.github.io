<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F4F2EC">
<title>Ильм — аудиоуроки и книги</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --acc:#EE4A18; --acc-ink:#FFF7F2; --acc-soft:rgba(238,74,24,.13);
  --pine:#0E4B3D; --pine-ink:#E9F4EE;
  --fd:'Unbounded',system-ui,sans-serif; --fb:'Golos Text',system-ui,sans-serif;
  --tb:calc(86px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;height:100%}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
::selection{background:var(--acc-soft)}

.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(620px 420px at 108% -8%,var(--glow1),transparent 62%),
             radial-gradient(560px 420px at -18% 112%,var(--glow2),transparent 60%)}
.ambient::after{content:'';position:absolute;inset:0;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
#app{position:fixed;inset:0;z-index:1}

/* ---------- screens ---------- */
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;
  padding:calc(env(safe-area-inset-top) + 18px) 18px var(--tb);scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr.on{display:block}
.scr.fwd{animation:inR .32s cubic-bezier(.2,.8,.25,1)}
.scr.bwd{animation:inL .32s cubic-bezier(.2,.8,.25,1)}
.scr.pop{animation:inUp .38s cubic-bezier(.2,.8,.25,1)}
@keyframes inR{from{opacity:0;transform:translateX(30px)}}
@keyframes inL{from{opacity:0;transform:translateX(-30px)}}
@keyframes inUp{from{opacity:0;transform:translateY(48px)}}
.fade{animation:fadeUp .5s cubic-bezier(.2,.8,.25,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}

/* ---------- typography ---------- */
.kick{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.ttl{font-family:var(--fd);font-size:24px;font-weight:700;line-height:1.18;margin:0}
.h2{font-family:var(--fd);font-size:16px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
.cnt{font-family:var(--fb);font-size:12px;font-weight:700;color:var(--ink2);background:var(--card2);border-radius:99px;padding:3px 9px}
.ic{width:21px;height:21px;display:block;flex:none}
.ic-s{width:16px;height:16px}
.ic-l{width:28px;height:28px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;
  border-radius:15px;padding:14px 20px;transition:transform .15s,filter .2s;user-select:none}
.btn:active{transform:scale(.96)}
.btn.pr{background:var(--acc);color:var(--acc-ink);box-shadow:0 10px 24px -10px var(--acc)}
.btn.gh{background:var(--card2)}
.btn.dngr{background:rgba(226,58,40,.12);color:#E23A28}
.btn.wide{width:100%}
.btn.sm{padding:10px 14px;font-size:13.5px;border-radius:12px}
.icbtn{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;box-shadow:var(--sh-s);transition:transform .15s;flex:none}
.icbtn:active{transform:scale(.92)}
.icbtn.sm{width:34px;height:34px;border-radius:11px;box-shadow:none;background:var(--card2);border-color:transparent}
.addbtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--acc);
  background:var(--acc-soft);border-radius:99px;padding:8px 14px;transition:transform .15s}
.addbtn:active{transform:scale(.94)}
.heart{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);transition:transform .15s,color .2s;flex:none}
.heart:active{transform:scale(.82)}
.heart.on{color:var(--acc)}
.heart.on .ic path{fill:currentColor}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh)}
.bar{height:4px;border-radius:4px;background:var(--card2);overflow:hidden;flex:none}
.bar i{display:block;height:100%;border-radius:4px;background:var(--acc);transition:width .6s cubic-bezier(.2,.8,.25,1)}
.bar.big{height:6px;border-radius:6px;flex:1}

/* equalizer */
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px;width:18px}
.eq i{flex:1;background:currentColor;border-radius:2px;height:30%;opacity:.4}
.eq.on i{opacity:1;animation:eqb 1s ease-in-out infinite}
.eq.on i:nth-child(2){animation-delay:.18s}.eq.on i:nth-child(3){animation-delay:.36s}.eq.on i:nth-child(4){animation-delay:.55s}
@keyframes eqb{0%,100%{height:26%}50%{height:100%}}

/* ---------- header ---------- */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.hdr-r{display:flex;gap:8px}

/* ---------- home ---------- */
.cont{position:relative;background:var(--pine);color:var(--pine-ink);border:0;border-radius:22px;
  padding:18px 18px 20px;margin-bottom:14px;overflow:hidden;cursor:pointer}
.cont::before{content:'';position:absolute;width:230px;height:230px;border-radius:50%;right:-70px;top:-90px;
  background:radial-gradient(circle,var(--glow1c),transparent 65%)}
.cont-top{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.cont-t{font-family:var(--fd);font-size:19px;font-weight:700;margin:12px 0 4px;max-width:78%;line-height:1.25}
.cont-m{font-size:13px;opacity:.75;margin-bottom:14px}
.cont-bar{height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden;max-width:72%}
.cont-bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.cont-play{position:absolute;right:16px;bottom:16px;width:54px;height:54px;border-radius:50%;background:var(--acc);
  color:var(--acc-ink);display:grid;place-items:center;box-shadow:0 12px 26px -10px rgba(0,0,0,.5)}
.cont-play .ic{width:22px;height:22px;margin-left:2px}

.sum{display:flex;align-items:center;gap:18px;padding:18px;margin-bottom:22px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring .rb{fill:none;stroke:var(--card2);stroke-width:7}
.ring .rf{fill:none;stroke:var(--acc);stroke-width:7;stroke-linecap:round;stroke-dasharray:169.6;
  stroke-dashoffset:calc(169.6 - 169.6 * var(--p,0) / 100);transition:stroke-dashoffset 1.1s .15s cubic-bezier(.2,.8,.25,1)}
.ring-v{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:19px}
.ring-v small{font-size:10px;font-weight:600;color:var(--ink2)}
.sum-ttl{font-family:var(--fd);font-size:15px;font-weight:700;margin-bottom:5px}
.sum-meta{font-size:13px;color:var(--ink2);line-height:1.45}
.sum-meta b{color:var(--ink)}
.sum-streak{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:12.5px;font-weight:700;color:var(--acc)}

.sec-head{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
.sec-card{display:flex;align-items:center;gap:14px;padding:15px 16px;margin-bottom:11px;cursor:pointer;transition:transform .15s}
.sec-card:active{transform:scale(.98)}
.sec-ico{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:26px;flex:none}
.sec-ico.xl{width:66px;height:66px;border-radius:20px;font-size:32px;margin-bottom:14px}
.sec-info{flex:1;min-width:0}
.sec-t{font-weight:700;font-size:15.5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-m{font-size:12.5px;color:var(--ink2);margin-bottom:8px}
.sec-go{flex:none;opacity:.9}
.foot{text-align:center;font-size:11.5px;color:var(--ink2);padding:18px 0 6px;letter-spacing:.04em}

/* ---------- section / subs / lessons ---------- */
.sec-hero{padding:22px 20px;margin-bottom:16px}
.sec-desc{color:var(--ink2);font-size:14px;line-height:1.5;margin:8px 0 0}
.hero-bar{display:flex;align-items:center;gap:12px;margin-top:16px}
.hero-pct{font-family:var(--fd);font-weight:800;font-size:17px}
.sub-actions{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.sub-head{display:flex;align-items:center;gap:10px;padding:14px 16px;margin:16px 0 10px;cursor:pointer}
.sub-t{font-weight:700;font-size:15px}
.sub-m{font-size:12px;color:var(--ink2);margin-top:2px}
.sub-chev{color:var(--ink2);transition:transform .2s;flex:none}
.sub-head.closed .sub-chev{transform:rotate(-90deg)}
.lrow{display:flex;align-items:center;gap:13px;padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:transform .15s}
.lrow:active{transform:scale(.985)}
.lrow-n{width:38px;height:38px;border-radius:12px;background:var(--card2);display:grid;place-items:center;
  font-family:var(--fd);font-weight:700;font-size:14px;flex:none;color:var(--ink2)}
.lrow-t{flex:1;min-width:0}
.lrow-t .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow-t .m{font-size:12px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow.done .lrow-t .t{color:var(--ink2)}
.lrow.now{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft),var(--sh)}

/* ---------- books ---------- */
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px}
.bcard{animation:fadeUp .5s both}
.bcover{position:relative;aspect-ratio:3/4;border-radius:15px;overflow:hidden;padding:16px 14px;cursor:pointer;
  display:flex;flex-direction:column;box-shadow:var(--sh);transition:transform .18s}
.bcover:active{transform:scale(.96)}
.bcover::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:1.5px;background:rgba(255,255,255,.35)}
.bcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bc-t{font-family:var(--fd);color:#fff;font-weight:700;font-size:14px;line-height:1.3;margin-top:auto;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.bc-a{color:rgba(255,255,255,.75);font-size:10.5px;margin-top:6px}
.bc-open{position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:9px;background:rgba(0,0,0,.28);
  color:#fff;display:grid;place-items:center;backdrop-filter:blur(4px)}
.bmeta{padding:9px 2px 0}
.bt{font-weight:700;font-size:13.5px;line-height:1.3}
.ba{font-size:11.5px;color:var(--ink2);margin:3px 0 8px}
.brow{display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--ink2);
  background:var(--card2);border-radius:99px;padding:6px 10px;transition:.2s}
.chip.on{background:var(--pine);color:var(--pine-ink)}

/* ---------- player ---------- */
#scr-player{padding:calc(env(safe-area-inset-top) + 14px) 22px calc(24px + env(safe-area-inset-bottom));
  display:none;flex-direction:column}
#scr-player.on{display:flex}
.p-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.p-crumb{text-align:center;min-width:0}
.p-c1{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.p-c2{font-size:12.5px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-art{position:relative;width:min(72vw,290px);aspect-ratio:1;margin:16px auto 22px;border-radius:30px;overflow:hidden;
  display:grid;place-items:center;box-shadow:0 30px 60px -24px rgba(0,0,0,.5);transition:transform .4s}
.p-art::before{content:'';position:absolute;inset:0;background:linear-gradient(150deg,var(--c1),var(--c2));}
.p-art::after{content:'';position:absolute;width:150%;height:90%;left:-25%;top:-55%;border-radius:50%;background:rgba(255,255,255,.16)}
.p-art span{position:relative;font-size:92px;filter:drop-shadow(0 10px 22px rgba(0,0,0,.35))}
.p-art.playing{animation:artp 3.2s ease-in-out infinite}
@keyframes artp{0%,100%{transform:scale(1)}50%{transform:scale(1.022)}}
.p-ttl{font-family:var(--fd);font-size:21px;font-weight:700;line-height:1.25;text-align:center}
.p-sub{color:var(--ink2);font-size:13px;text-align:center;margin:7px auto 0;max-width:88%;line-height:1.45}
.wave{display:flex;align-items:center;gap:2px;height:74px;margin-top:26px;touch-action:none;cursor:pointer}
.wave i{flex:1;min-width:2px;border-radius:2px;background:var(--wv);transition:background .12s}
.wave i.on{background:var(--acc)}
.p-times{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--ink2);margin-top:8px;font-variant-numeric:tabular-nums}
.p-ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.p-side{display:flex;flex-direction:column;align-items:center;gap:4px;width:58px;color:var(--ink2);font-size:11px;font-weight:700}
.p-side.on{color:var(--acc)}
.p-play{width:86px;height:86px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;
  box-shadow:0 18px 38px -12px var(--acc);transition:transform .15s}
.p-play:active{transform:scale(.92)}
.p-play .ic{width:34px;height:34px}
.p-play .pl{margin-left:3px}

/* ---------- stats ---------- */
.st-big{font-family:var(--fd);font-weight:800;font-size:66px;line-height:1;text-align:center;margin:10px 0 2px}
.st-big span{font-size:28px;color:var(--acc)}
.st-lbl{text-align:center;color:var(--ink2);font-size:13px;margin-bottom:22px}
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:22px}
.st-card{padding:16px}
.st-v{font-family:var(--fd);font-weight:800;font-size:21px;display:flex;align-items:center;gap:7px}
.st-l{font-size:12px;color:var(--ink2);margin-top:5px}
.st-sec{padding:14px 16px;margin-bottom:10px}
.st-st{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:9px}
.st-st span{color:var(--ink2);font-weight:500}

/* ---------- settings / rows ---------- */
.grp{margin-bottom:20px}
.grp-t{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:0 4px 9px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin-bottom:8px;cursor:pointer}
.row:active{transform:scale(.99)}
.row-t{font-weight:600;font-size:14.5px}
.row-m{font-size:12px;color:var(--ink2);margin-top:2px}
.seg{display:flex;background:var(--card2);border-radius:13px;padding:4px;width:100%}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-weight:600;font-size:13px;color:var(--ink2);transition:.2s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh-s)}
.sw{width:48px;height:29px;border-radius:99px;background:var(--card2);border:1px solid var(--line);position:relative;transition:.2s;flex:none}
.sw::after{content:'';position:absolute;top:2.5px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.25);transition:.2s}
.sw.on{background:var(--acc);border-color:var(--acc)}
.sw.on::after{left:21px}

/* ---------- editor ---------- */
.fld{margin-bottom:16px}
.fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:0 3px 8px}
.fld input,.fld textarea{width:100%;background:var(--card2);border:1.5px solid transparent;border-radius:14px;
  padding:13px 14px;font-size:15px;outline:none;transition:.2s;resize:none}
.fld input:focus,.fld textarea:focus{border-color:var(--acc);background:var(--card)}
.emojis{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.emojis button{width:38px;height:38px;border-radius:11px;background:var(--card2);font-size:19px;display:grid;place-items:center}
.emojis button.on{outline:2px solid var(--acc)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;transition:transform .15s}
.swatch:active{transform:scale(.88)}
.swatch.on{outline:2.5px solid var(--ink);outline-offset:2.5px}
.hint{background:var(--acc-soft);border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.5;color:var(--ink);margin-bottom:18px}
.ed-btns{display:flex;gap:10px;margin-top:22px}
.ed-btns .btn{flex:1}

/* ---------- empty ---------- */
.empty{text-align:center;padding:48px 24px;animation:fadeUp .5s both}
.empty .e-ic{font-size:44px;margin-bottom:12px}
.empty .e-t{font-family:var(--fd);font-weight:700;font-size:16px;margin-bottom:6px}
.empty .e-m{font-size:13px;color:var(--ink2);line-height:1.5;margin-bottom:18px}

/* ---------- tabbar / miniplayer / toast / modal ---------- */
#tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));height:64px;z-index:40;
  background:var(--tab);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:22px;display:flex;box-shadow:var(--sh)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--ink2);font-size:10.5px;font-weight:600;letter-spacing:.02em;transition:color .2s}
.tab.on{color:var(--acc)}
#miniplayer{position:fixed;left:12px;right:12px;bottom:var(--tb);z-index:39;background:var(--card);
  border:1px solid var(--line);border-radius:17px;display:flex;align-items:center;gap:10px;padding:10px 12px;
  box-shadow:var(--sh);animation:mpIn .35s cubic-bezier(.2,.8,.25,1);cursor:pointer}
#miniplayer.notabs{bottom:calc(14px + env(safe-area-inset-bottom))}
@keyframes mpIn{from{opacity:0;transform:translateY(18px)}}
.mp-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.mp-t{flex:1;min-width:0}
.mp-t .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-t .m{font-size:11.5px;color:var(--ink2);margin-top:1px}
.mp-x{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--ink2);flex:none;
  transition:transform .15s,color .2s}
.mp-x:active{transform:scale(.85);color:var(--ink)}
.mp-prog{position:absolute;left:14px;right:14px;bottom:5px;height:2.5px;border-radius:2px;background:var(--card2);overflow:hidden}
.mp-prog i{display:block;height:100%;background:var(--acc);width:0}

#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(16px);bottom:calc(150px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:600;
  opacity:0;transition:.25s;z-index:95;pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}

#modal{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.m-back{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:.25s}
#modal.on .m-back{opacity:1}
.m-card{position:relative;width:100%;max-width:540px;background:var(--card);border-radius:24px 24px 0 0;
  padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:82vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.25,1)}
#modal.on .m-card{transform:none}
.m-ttl{font-family:var(--fd);font-size:17px;font-weight:700;margin-bottom:8px}
.m-txt{font-size:13.5px;color:var(--ink2);line-height:1.55;margin:0 0 16px}
.m-btns{display:flex;gap:10px;margin-top:16px}
.m-btns .btn{flex:1}

<script>
'use strict';
/* ============================================================
   НАСТРОЙКИ ПОД СЕБЯ
============================================================ */
const APP_NAME = 'Ильм';                 // ← название вашего приложения
const VER = '1.4';
// Ссылка на ваш content.json (экспорт из режима автора), чтобы один и тот же
// контент видели все ученики на любых устройствах:
const CONTENT_URL = '';

/* ===== ПРАВА АДМИНИСТРАТОРА =====
   Вставьте СВОЙ Telegram ID (узнать: бот @userinfobot → Start → "Id: 123456789").
   Только этот аккаунт видит «Режим автора», кнопки правок и импорт. */
const ADMIN_ID = 0;            // ← например: 123456789
const ADMIN_USERNAME = '';     // ← запасной вариант: ваш @username без @

/* ============================================================ */
const tg = window.Telegram && window.Telegram.WebApp || null;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
const TG_USER = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;

function isAdminUser(){
  if (!TG_USER) return false;
  if (ADMIN_ID && String(TG_USER.id) === String(ADMIN_ID)) return true;
  if (ADMIN_USERNAME && TG_USER.username &&
      TG_USER.username.toLowerCase() === String(ADMIN_USERNAME).replace('@','').toLowerCase()) return true;
  return false;
}

const $  = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const trunc = (s, n) => s && s.length > n ? s.slice(0, n - 1) + '…' : (s || '');
const fmt = s => { if (!s || !isFinite(s)) return '—'; s = Math.max(0, Math.round(s));
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const fmtMin = s => { const m = Math.round(s/60); return m >= 60 ? Math.floor(m/60)+' ч '+m%60+' м' : m+' мин'; };
function hexA(hex, a){ const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n>>16) + ',' + (n>>8 & 255) + ',' + (n & 255) + ',' + a + ')'; }
function darken(hex, f){ const n = parseInt(hex.slice(1), 16);
  return 'rgb(' + Math.round((n>>16)*(1-f)) + ',' + Math.round((n>>8&255)*(1-f)) + ',' + Math.round((n&255)*(1-f)) + ')'; }
function hashStr(s){ let h = 0; for (let i = 0; i < s.length; i++) h = (h*31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hap(t){ try{ if (tg && tg.HapticFeedback)
  t === 'success' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.impactOccurred(t || 'light'); }catch(e){} }
function dayKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

/* ---------- иконки ---------- */
const I = {
  home:'<path d="M3 10.8 12 3l9 7.8"/><path d="M5.5 9.6V21h13V9.6"/>',

  chart:'<path d="M5 20v-6"/><path d="M12 20V6"/><path d="M19 20v-9"/><path d="M3.5 20h17"/>',
  sliders:'<path d="M4 7h9"/><circle cx="16.8" cy="7" r="2.7"/><path d="M20 17h-9"/><circle cx="7.2" cy="17" r="2.7"/>',
  play:'<path d="M8.2 5.4v13.2L19 12z" fill="currentColor" stroke="none"/>',

  pen:'<path d="M4.5 19.5l.9-3.8L16.6 4.5a2.05 2.05 0 0 1 2.9 2.9L8.3 18.6z"/>',
  trash:'<path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/><path d="M6.5 7 8 20h8l1.5-13"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  ext:'<path d="M7 17 17 7"/><path d="M9.5 7H17v7.5"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7"/>',
  dl:'<path d="M12 4v10"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19.5h14"/>',

  flame:'<path d="M12 3c1.2 2.4 4.8 4.9 4.8 8.8A4.8 4.8 0 0 1 12 16.6a4.8 4.8 0 0 1-4.8-4.8c0-1.5.6-2.9 1.5-4.1.5 1 1.1 1.7 2 2.2C10.5 7.4 11 5 12 3z"/><path d="M12 21v-4.4"/>',
  doc:'<path d="M6.5 3h7.5l4 4v14h-11.5z"/><path d="M14 3v4h4"/>'
};
const ic = (n, cls) => '<svg class="ic ' + (cls||'') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + I[n] + '</svg>';
const eqBars = () => '<i></i><i></i><i></i><i></i>';

/* ---------- данные ---------- */
const LS_OLD = 'miniapp_db_v1';
const LS = 'ilm_db_v2_' + (TG_USER ? TG_USER.id : 'guest');
const SWATCHES = ['#EE4A18','#0E5A4A','#2B50C4','#D9971B','#8A3FC0','#C22F4F','#3A3F47'];
const EMOJIS = ['📚','🎧','🧭','✍️','🗣️','🧠','','⭐','🌙','🕌'];
const COVERS = [['#E8431C','#6E1D08'],['#0E5A4A','#052E27'],['#2B50C4','#131F55'],['#C22F4F','#4E0F1F'],['#8A3FC0','#35165A'],['#C98A12','#5C3D05']];

function seed(){
  const SH = n => 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-' + n + '.mp3';
  return { v:1,
    settings:{ onboarded:false, admin:false, theme:'auto', speed:1 },
    sections:[
      { id:'sec1', title:'Основы', emoji:'🧭', color:'#EE4A18', desc:'С чего начинается путь: базовые понятия и настройка на занятие.', lessons:[
        { id:'l1', title:'Знакомство с курсом', desc:'О чём этот путь и как заниматься.', url:SH(1) },
        { id:'l2', title:'Первые шаги', desc:'Практика: слушать, повторять, закреплять.', url:SH(2) },
        { id:'l3', title:'Главные термины', desc:'Словарь, без которого дальше будет сложно.', url:SH(3) },
        { id:'l4', title:'Частые ошибки', desc:'Разбираем, что обычно идёт не так.', url:SH(4) } ], subs:[] },
      { id:'sec2', title:'Практика', emoji:'🎧', color:'#0E5A4A', desc:'Уроки для отработки: слушайте и повторяйте.', lessons:[
        { id:'l5', title:'Разминка', desc:'Короткая настройка перед занятием.', url:SH(5) } ],
        subs:[ { id:'sub1', title:'Тренировка темпа', desc:'', lessons:[
          { id:'l6', title:'Тренировка темпа', desc:'Учимся держать ритм.', url:SH(6) },
          { id:'l7', title:'Закрепление', desc:'Итоговая практика раздела.', url:SH(7) } ] } ] },
      { id:'sec3', title:'Углублённый уровень', emoji:'🚀', color:'#2B50C4', desc:'Для тех, кто прошёл основу.', lessons:[
        { id:'l8', title:'Продвинутые приёмы', desc:'Сложные кейсы и нюансы.', url:SH(8) } ], subs:[] }
    ],
    books:[
      { id:'b1', title:'Хрестоматия. Том 1', author:'Материалы курса', url:'https://mozilla.github.io/pdf.js/web/compressed.tracemonkey-pldi-09.pdf' },
      { id:'b2', title:'Практический сборник', author:'Материалы курса', url:'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf' },
      { id:'b3', title:'Конспект занятий', author:'Черновик', url:'https://pdfobject.com/pdf/sample.pdf' }
    ],
    progress:{}, favL:[], favB:[], readB:[], days:{}, listenSec:0, last:null };
}
let db;
try { db = JSON.parse(localStorage.getItem(LS)); } catch(e){}
if ((!db || db.v !== 1) && isAdminUser()){
  try { const old = JSON.parse(localStorage.getItem(LS_OLD));
    if (old && old.v === 1){ db = old; localStorage.setItem(LS, JSON.stringify(old)); } } catch(e){}
}
if (!db || db.v !== 1) db = seed();
db.days = db.days || {}; db.favB = db.favB || [];
function normalize(){
  db.sections = db.sections || [];
  db.sections.forEach(s => {
    s.lessons = s.lessons || [];
    s.subs = (s.subs || []).map(x => ({ id:x.id || uid(), title:x.title || 'Подраздел', desc:x.desc || '', lessons:x.lessons || [] }));
  }); }
normalize();
function save(){ try { localStorage.setItem(LS, JSON.stringify(db)); } catch(e){} }

/* ---------- справочники ---------- */
const findSection = id => db.sections.find(s => s.id === id);
const flatLessons = s => (s.lessons || []).concat((s.subs || []).reduce((a, sub) => a.concat(sub.lessons || []), []));
function findLesson(id){
  for (const s of db.sections){
    const flat = flatLessons(s);
    const fi = flat.findIndex(l => l.id === id);
    if (fi > -1){
      let sub = null;
      for (const sb of (s.subs || [])) if ((sb.lessons || []).some(l => l.id === id)) sub = sb;
      return { l: flat[fi], s, sub, fi }; } }
  return null; }
const prOf = id => db.progress[id];
const durOf = l => (prOf(l.id) && prOf(l.id).dur) || 0;
const lessonCount = () => db.sections.reduce((a,s)=>a+flatLessons(s).length,0);
const doneCount = () => db.sections.reduce((a,s)=>a+flatLessons(s).filter(l=>prOf(l.id)&&prOf(l.id).done).length,0);
function streak(){ let n = 0, d = new Date();
  if (!(db.days[dayKey(d)] > 0)) d.setDate(d.getDate()-1);
  while (db.days[dayKey(d)] > 0){ n++; d.setDate(d.getDate()-1); } return n; }
function continueLesson(){ if (!db.last) return null; const f = findLesson(db.last.id);
  if (!f) return null; const pr = prOf(f.l.id);
  if (pr && pr.done) return null; return f; }
function nextLesson(id){ const f = findLesson(id); if (!f) return null;
  const flat = flatLessons(f.s);
  if (f.fi + 1 < flat.length) return flat[f.fi+1];
  const si = db.sections.indexOf(f.s);
  for (let k = si+1; k < db.sections.length; k++){ const fl = flatLessons(db.sections[k]); if (fl.length) return fl[0]; }
  return null; }
const userName = () => (TG_USER && TG_USER.first_name) || 'друг';
const canEdit = () => isAdminUser() && !!db.settings.admin;
const collapsedSubs = new Set();

function greet(){ const h = new Date().getHours();
  return h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер'; }
function dateLine(){ const s = new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
  return s[0].toUpperCase() + s.slice(1); }
const toggleArr = (key, id) => { const i = db[key].indexOf(id); i > -1 ? db[key].splice(i,1) : db[key].push(id); };
function coverGrad(b){ const c = COVERS[hashStr(b.id) % COVERS.length];
  return 'linear-gradient(155deg,' + c[0] + ',' + c[1] + ')'; }
function plural(n, a, b, c){ n = Math.abs(n) % 100; const d = n % 10;
  if (n > 10 && n < 20) return c; if (d > 1 && d < 5) return b; if (d === 1) return a; return c; }

/* ---------- тема ---------- */
const PAL = {
  light:{ bg:'#F4F2EC', card:'#FFFFFF', card2:'#ECE8DF', ink:'#171A1F', ink2:'#787B82',
    line:'rgba(23,26,31,.09)', wv:'rgba(23,26,31,.18)', tab:'rgba(255,255,255,.82)',
    sh:'0 12px 30px -20px rgba(25,25,40,.4)', shs:'0 3px 10px -6px rgba(25,25,40,.25)',
    glow1:'rgba(238,74,24,.17)', glow1c:'rgba(238,74,24,.35)', glow2:'rgba(14,75,61,.14)' },
  dark:{ bg:'#101317', card:'#181C22', card2:'#22272F', ink:'#F1EFE9', ink2:'#989EA7',
    line:'rgba(241,239,233,.09)', wv:'rgba(241,239,233,.2)', tab:'rgba(24,28,34,.82)',
    sh:'0 14px 30px -20px rgba(0,0,0,.7)', shs:'0 3px 10px -6px rgba(0,0,0,.5)',
    glow1:'rgba(255,92,46,.13)', glow1c:'rgba(255,92,46,.28)', glow2:'rgba(20,82,69,.22)' } };
function isDark(){ const t = db.settings.theme;
  if (t === 'dark') return true; if (t === 'light') return false;
  if (tg && tg.colorScheme) return tg.colorScheme === 'dark';
  return matchMedia('(prefers-color-scheme: dark)').matches; }
function applyTheme(){
  const d = isDark(); let p = Object.assign({}, d ? PAL.dark : PAL.light);
  if (db.settings.theme === 'auto' && tg && tg.themeParams){ const tp = tg.themeParams;
    if (tp.secondary_bg_color) p.bg = tp.secondary_bg_color;
    if (tp.bg_color) p.card = tp.bg_color;
    if (tp.text_color) p.ink = tp.text_color;
    if (tp.hint_color) p.ink2 = tp.hint_color; }
  const r = document.documentElement.style;
  const map = { bg:'--bg', card:'--card', card2:'--card2', ink:'--ink', ink2:'--ink2', line:'--line',
    wv:'--wv', tab:'--tab', glow1:'--glow1', glow1c:'--glow1c', glow2:'--glow2' };
  for (const k in map) r.setProperty(map[k], p[k]);
  r.setProperty('--sh', p.sh); r.setProperty('--sh-s', p.shs);
  document.documentElement.dataset.dark = d ? '1' : '0';
  const mt = document.querySelector('meta[name=theme-color]'); if (mt) mt.content = p.bg;
  try { if (tg){ tg.setHeaderColor && tg.setHeaderColor(p.bg); tg.setBackgroundColor && tg.setBackgroundColor(p.bg); } } catch(e){} }
if (tg && tg.onThemeChanged) tg.onThemeChanged(() => db.settings.theme === 'auto' && applyTheme());
matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (db.settings.theme === 'auto' && !(tg && tg.colorScheme)) applyTheme(); });

/* ---------- роутер ---------- */
const TABS = [['home','home','Главная'],['books','book','Книги'],['favs','heart','Избранное'],['stats','chart','Прогресс']];
let stack = [{ s:'home', p:{} }];
let curEl = null, curKey = '', scrollPos = {}, favTab = 'l';
const stackTop = () => stack[stack.length - 1];
function go(s, p){ stack.push({ s, p: p || {} }); history.pushState({ d: stack.length }, ''); renderTop(1); }
function setTab(t){ stack = [{ s:t, p:{} }]; history.pushState({ d:1 }, ''); renderTop(1); }
window.addEventListener('popstate', e => {
  const d = (e.state && e.state.d) || 1;
  if (d < 1){ history.replaceState({ d:1 }, ''); return; }
  stack = stack.slice(0, d); renderTop(-1); });
if (tg && tg.BackButton) tg.BackButton.onClick(() => history.back());
function rerender(){ renderTop(0); }

/* ============================================================
   АУДИО-ДВИЖОК
============================================================ */
const AE = {
  a: new Audio(), cur: null, pending: 0, speed: db.settings.speed || 1, lastT: 0, saveTick: 0,
  load(l, autoplay){
    this.cur = l.id; this.a.src = l.url; this.a.preload = 'metadata';
    this.a.playbackRate = this.speed;
    const pr = prOf(l.id);
    this.pending = (pr && pr.pos > 1 && (!pr.dur || pr.pos < pr.dur - 4)) ? pr.pos : 0;
    db.last = { id: l.id, ts: Date.now() };
    if (autoplay) this.a.play().catch(() => {});
    msMeta(l); save(); syncMini();
  },
  toggle(){ if (!this.cur) return; this.a.paused ? this.a.play().catch(()=>{}) : this.a.pause(); },
  skip(s){ if (!isFinite(this.a.duration)) return;
    this.a.currentTime = Math.min(Math.max(0, this.a.currentTime + s), this.a.duration - .3); },
  seek(f){ if (!isFinite(this.a.duration)) return;
    this.a.currentTime = Math.min(Math.max(0, f), .995) * this.a.duration; },
  stop(){ this.cur = null; this.a.pause(); this.a.removeAttribute('src'); try{ this.a.load(); }catch(e){} }
};
AE.a.addEventListener('loadedmetadata', () => {
  const id = AE.cur; if (!id) return;
  const pr = db.progress[id] || (db.progress[id] = {});
  pr.dur = AE.a.duration; save();
  if (AE.pending > 1 && AE.pending < AE.a.duration - 3) AE.a.currentTime = AE.pending;
  AE.pending = 0; AE.lastT = AE.a.currentTime; playerTick();
});
AE.a.addEventListener('timeupdate', () => {
  const t = AE.a.currentTime, id = AE.cur; if (!id) return;
  const dt = t - AE.lastT;
  if (dt > 0 && dt < 1.5 && !AE.a.paused){
    db.listenSec = (db.listenSec || 0) + dt;
    const k = dayKey(new Date()); db.days[k] = (db.days[k] || 0) + dt; }
  AE.lastT = t;
  const pr = db.progress[id] || (db.progress[id] = {}); pr.pos = t; pr.ts = Date.now();
  if (AE.a.duration && t / AE.a.duration > .93 && !pr.done) markDone(id, true);
  if (++AE.saveTick % 12 === 0) save();
  playerTick(); miniTick();
});
AE.a.addEventListener('play', () => { AE.lastT = AE.a.currentTime; onPlayState(); });
AE.a.addEventListener('pause', () => { save(); onPlayState(); });
AE.a.addEventListener('ended', () => {
  if (AE.cur) markDone(AE.cur, true);
  save(); const nx = AE.cur && nextLesson(AE.cur);
  if (nx){ toast('Далее: ' + nx.title); setTimeout(() => { AE.load(nx, true); rerender(); }, 700); }
  onPlayState();
});
AE.a.addEventListener('error', () => { if (AE.cur) toast('Не удалось загрузить аудио. Проверьте ссылку.'); });
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => document.hidden && save());
setInterval(save, 10000);

function markDone(id, v){
  const pr = db.progress[id] || (db.progress[id] = {});
  if (v && !pr.done){ pr.done = true; pr.doneTs = Date.now(); pr.pos = pr.dur || pr.pos;
    hap('success'); toast('Урок пройден 🎉'); save(); }
  else if (!v){ pr.done = false; save(); } }
function onPlayState(){
  const playing = AE.cur && !AE.a.paused;
  const pb = $('#p-playbtn');
  if (pb) pb.innerHTML = ic(playing ? 'pause' : 'play', playing ? '' : 'pl');
  const art = $('.p-art'); if (art) art.classList.toggle('playing', !!playing);
  document.querySelectorAll('.eq[data-live]').forEach(e => e.classList.toggle('on', playing));
  syncMini();
  const top = stackTop().s;
  if (['section','home','favs'].includes(top)) rerender(); }
function msMeta(l){ if (!('mediaSession' in navigator)) return;
  try { const f = findLesson(l.id);
    navigator.mediaSession.metadata = new MediaMetadata({ title:l.title, artist:(f && f.s.title) || APP_NAME, album:APP_NAME });
    navigator.mediaSession.setActionHandler('play', () => AE.a.play());
    navigator.mediaSession.setActionHandler('pause', () => AE.a.pause());
    navigator.mediaSession.setActionHandler('seekbackward', () => AE.skip(-15));
    navigator.mediaSession.setActionHandler('seekforward', () => AE.skip(15)); } catch(e){} }

/* ============================================================
   ЭКРАНЫ

    '</div>'; }
function playerTick(){
  const top = stackTop(); if (top.s !== 'player') return;
  const cur = $('#p-cur'), dur = $('#p-dur'); if (!cur) return;
  const d = (isFinite(AE.a.duration) && AE.a.duration) || durOf(findLesson(top.p.id) ? findLesson(top.p.id).l : {}) || 0;
  cur.textContent = fmt(AE.a.currentTime); if (d) dur.textContent = fmt(d);
  if (waveBarsEl && d){ const f = AE.a.currentTime / d;
    for (let i = 0; i < waveBarsEl.length; i++) waveBarsEl[i].classList.toggle('on', i / waveN <= f); } }
function initWave(){
  const w = $('#wave'); if (!w) return;
  waveBarsEl = Array.from(w.children);
  let drag = false;
  const frac = e => { const r = w.getBoundingClientRect();
    return Math.min(.995, Math.max(0, (e.clientX - r.left) / r.width)); };
  const preview = f => { for (let i = 0; i < waveBarsEl.length; i++) waveBarsEl[i].classList.toggle('on', i/waveN <= f);
    const d = isFinite(AE.a.duration) ? AE.a.duration : 0; const c = $('#p-cur'); if (c && d) c.textContent = fmt(f*d); };
  w.addEventListener('pointerdown', e => { drag = true; w.setPointerCapture(e.pointerId); preview(frac(e)); });
  w.addEventListener('pointermove', e => drag && preview(frac(e)));
  w.addEventListener('pointerup', e => { if (!drag) return; drag = false; AE.seek(frac(e)); });
  playerTick(); }

/* ---------- редактор (только админ) ---------- */
let ED = null;
function openEditor(kind, id, sec, sub){
  if (!canEdit()) return;
  let ex = null;
  if (kind === 'section') ex = id ? findSection(id) : null;
  else if (kind === 'sub') ex = id ? ((findSection(sec) || { subs: [] }).subs || []).find(x => x.id === id) : null;
  else if (kind === 'lesson'){ const f = id ? findLesson(id) : null;
    if (f){ ex = f.l; sec = f.s.id; sub = f.sub ? f.sub.id : null; } }
  else ex = id ? db.books.find(b => b.id === id) : null;
  ED = { kind, id, sec, sub,
    color: (ex && ex.color) || SWATCHES[db.sections.length % SWATCHES.length],
    emoji: (ex && ex.emoji) || EMOJIS[0] };
  go('editor', { kind, id, sec }); }
const fld = (l, inner) => '<div class="fld"><label>' + l + '</label>' + inner + '</div>';
function vEditor(){
  const k = ED.kind;
  let ex = null;
  if (k === 'section') ex = ED.id ? findSection(ED.id) : null;
  else if (k === 'sub') ex = ED.id ? ((findSection(ED.sec) || { subs: [] }).subs || []).find(x => x.id === ED.id) : null;
  else if (k === 'lesson') ex = ED.id ? (findLesson(ED.id) || {}).l : null;
  else ex = ED.id ? db.books.find(b => b.id === ED.id) : null;
  const titles = { section: ex ? 'Раздел' : 'Новый раздел', sub: ex ? 'Подраздел' : 'Новый подраздел',
    lesson: ex ? 'Урок' : 'Новый урок', book: ex ? 'Книга' : 'Новая книга' };
  let h = '<header class="hdr"><button class="icbtn" data-action="back">' + ic('back') + '</button>' +
    '<h1 class="ttl" style="font-size:19px">' + titles[k] + '</h1><span style="width:42px"></span></header>';
  if (k === 'section'){
    h += fld('Название', '<input name="title" maxlength="60" placeholder="Например: Основы" value="' + esc(ex ? ex.title : '') + '">') +
      '<div class="fld"><label>Иконка</label><input name="emoji" maxlength="4" value="' + esc(ex ? ex.emoji : ED.emoji) + '">' +
      '<div class="emojis">' + EMOJIS.map(e => '<button data-action="emoji-q" data-e="' + e + '" class="' + ((ex ? ex.emoji : ED.emoji) === e ? 'on' : '') + '">' + e + '</button>').join('') + '</div></div>' +
      fld('Описание (необязательно)', '<textarea name="desc" rows="2" maxlength="140" placeholder="Пара слов о разделе">' + esc(ex && ex.desc || '') + '</textarea>') +
      '<div class="fld"><label>Цвет</label><div class="swatches">' + SWATCHES.map(c =>
        '<button class="swatch' + (ED.color === c ? ' on' : '') + '" style="background:' + c + '" data-action="swatch" data-c="' + c + '"></button>').join('') + '</div></div>' +
      '<div class="hint">💡 Раздел — это папка для подразделов и уроков.</div>';
  } else if (k === 'sub'){
    h += fld('Название', '<input name="title" maxlength="60" placeholder="Например: Часть 1" value="' + esc(ex ? ex.title : '') + '">') +
      fld('Описание (необязательно)', '<textarea name="desc" rows="2" maxlength="140">' + esc(ex && ex.desc || '') + '</textarea>') +
      '<div class="hint">💡 Подраздел группирует уроки внутри раздела. Добавляйте сколько нужно — ученики увидят их списком и смогут сворачивать.</div>';
  } else if (k === 'lesson'){
    h += fld('Название', '<input name="title" maxlength="80" placeholder="Например: Урок 1. Введение" value="' + esc(ex ? ex.title : '') + '">') +
      fld('Ссылка на аудио (mp3)', '<input name="url" inputmode="url" placeholder="https://…/файл.mp3" value="' + esc(ex ? ex.url : '') + '">') +
      fld('Описание (необязательно)', '<textarea name="desc" rows="2" maxlength="140">' + esc(ex && ex.desc || '') + '</textarea>') +
      '<div class="hint">💡 Нужна прямая https-ссылка на mp3. Подойдут файлы из облака (прямая ссылка), вашего хостинга или CDN. Длительность определится автоматически.</div>';
  } else {
    h += fld('Название', '<input name="title" maxlength="80" placeholder="Например: Хрестоматия" value="' + esc(ex ? ex.title : '') + '">') +
      fld('Автор', '<input name="author" maxlength="60" value="' + esc(ex && ex.author || '') + '">') +
      fld('Ссылка на PDF', '<input name="url" inputmode="url" placeholder="https://…/файл.pdf" value="' + esc(ex ? ex.url : '') + '">') +
      fld('Обложка — ссылка на картинку (необязательно)', '<input name="cover" inputmode="url" placeholder="https://…/cover.jpg" value="' + esc(ex && ex.cover || '') + '">') +
      '<div class="hint">💡 Прямая https-ссылка на .pdf. Без своей обложки приложение сгенерирует её само.</div>'; }
  h += '<div class="ed-btns">' + (ex ? '<button class="btn dngr" data-action="del-editor">' + ic('trash','ic-s') + ' Удалить</button>' : '') +
    '<button class="btn pr" data-action="save-editor">' + ic('check','ic-s') + ' Сохранить</button></div>';
  return h; }
function saveEditor(){
  if (!canEdit()) return toast('Нет доступа');
  if (!ED) return;
  const q = n => { const el = document.querySelector('#scr-editor [name="' + n + '"]'); return el ? el.value.trim() : ''; };
  const k = ED.kind;
  if (k === 'section'){
    const title = q('title'); if (!title) return toast('Введите название раздела');
    const data = { title, emoji: q('emoji') || '📁', desc: q('desc'), color: ED.color };
    if (ED.id) Object.assign(findSection(ED.id), data);
    else db.sections.push(Object.assign({ id: uid(), lessons: [], subs: [] }, data));
  } else if (k === 'sub'){
    const title = q('title'); if (!title) return toast('Введите название подраздела');
    const s = findSection(ED.sec); if (!s) return toast('Раздел не найден');
    const data = { title, desc: q('desc') };
    if (ED.id){ const sub = (s.subs || []).find(x => x.id === ED.id); if (sub) Object.assign(sub, data); }
    else { s.subs = s.subs || []; s.subs.push(Object.assign({ id: uid(), lessons: [] }, data)); }
  } else if (k === 'lesson'){
    const title = q('title'), url = q('url');
    if (!title) return toast('Введите название урока');
    if (!/^https?:\/\//.test(url)) return toast('Нужна прямая ссылка https на mp3');
    const data = { title, url, desc: q('desc') };
    if (ED.id){ const f = findLesson(ED.id); if (f) Object.assign(f.l, data); }
    else { const s = findSection(ED.sec); if (!s) return toast('Раздел не найден');
      if (ED.sub){ s.subs = s.subs || []; const sub = s.subs.find(x => x.id === ED.sub);
        if (!sub) return toast('Подраздел не найден');
        sub.lessons = sub.lessons || []; sub.lessons.push(Object.assign({ id: uid() }, data)); }
      else { s.lessons = s.lessons || []; s.lessons.push(Object.assign({ id: uid() }, data)); } }
  } else {
    const title = q('title'), url = q('url');
    if (!title) return toast('Введите название книги');
    if (!/^https?:\/\//.test(url)) return toast('Нужна прямая ссылка https на pdf');
    const data = { title, author: q('author'), url, cover: q('cover') };
    if (ED.id) Object.assign(db.books.find(b => b.id === ED.id) || {}, data);
    else db.books.push(Object.assign({ id: uid() }, data)); }
  normalize(); save(); hap('success'); toast('Сохранено'); history.back(); }
async function delEditor(){
  if (!canEdit()) return;
  if (!ED || !ED.id) return;
  const ok = await confirmBox('Удалить?', 'Действие нельзя отменить.', 'Удалить');
  if (!ok) return;
  const id = ED.id;
  if (ED.kind === 'section'){ db.sections = db.sections.filter(s => s.id !== id);
    if (AE.cur && !findLesson(AE.cur)) AE.stop(); }
  else if (ED.kind === 'sub'){ const s = findSection(ED.sec);
    if (s) s.subs = (s.subs || []).filter(x => x.id !== id);
    if (AE.cur && !findLesson(AE.cur)) AE.stop(); }
  else if (ED.kind === 'lesson'){ const f = findLesson(id);
    if (f){ if (f.sub) f.sub.lessons = f.sub.lessons.filter(l => l.id !== id);
      else f.s.lessons = f.s.lessons.filter(l => l.id !== id); }
    if (AE.cur === id) AE.stop(); }
  else db.books = db.books.filter(b => b.id !== id);
  db.favL = db.favL.filter(x => x !== id); db.favB = db.favB.filter(x => x !== id);
  save(); hap(); toast('Удалено'); history.back(); }

/* ---------- мини-плеер ---------- */
let mpId = null;
function syncMini(){
  const mp = $('#miniplayer'), top = stackTop().s;
  const show = !!AE.cur && top !== 'player' && top !== 'onboard' && db.settings.onboarded;
  mp.hidden = !show; if (!show) return;
  const tabsVisible = TABS.some(t => t[0] === top) && stack.length === 1;
  mp.classList.toggle('notabs', !tabsVisible);
  const f = findLesson(AE.cur); if (!f) return;
  if (mpId !== AE.cur){ mpId = AE.cur;
    mp.innerHTML = '<div class="mp-ico" style="background:' + hexA(f.s.color,.18) + '">' + (f.s.emoji || '🎧') + '</div>' +
      '<div class="mp-t" data-action="open-player"><div class="t">' + esc(f.l.title) + '</div><div class="m">' + esc(f.s.title) + (f.sub ? ' · ' + esc(f.sub.title) : '') + '</div></div>' +
      '<button class="mp-x" data-action="mp-close" aria-label="Закрыть аудио">' + ic('x','ic-s') + '</button>' +
      '<button class="icbtn" id="mp-btn" data-action="mp-toggle">' + ic(AE.a.paused ? 'play' : 'pause') + '</button>' +
      '<div class="mp-prog"><i id="mp-prog"></i></div>'; }
  const b = $('#mp-btn'); if (b) b.innerHTML = ic(AE.a.paused ? 'play' : 'pause'); }
function miniTick(){ const el = $('#mp-prog'); if (!el || !AE.cur) return;
  const pr = prOf(AE.cur); if (pr && pr.dur) el.style.width = Math.min(100, pr.pos/pr.dur*100) + '%'; }

/* ---------- chrome ---------- */
function buildTabbar(){ $('#tabbar').innerHTML = TABS.map(t =>
  '<button class="tab" data-action="tab" data-tab="' + t[0] + '">' + ic(t[1]) + '<span>' + t[2] + '</span></button>').join(''); }
let mbFn = null;
function setMB(t, fn){ if (!tg || !tg.MainButton) return;
  try { if (mbFn) tg.MainButton.offClick(mbFn); tg.MainButton.setText(t); tg.MainButton.show(); mbFn = fn; tg.MainButton.onClick(fn); } catch(e){} }
function clearMB(){ if (!tg || !tg.MainButton) return;
  try { if (mbFn) tg.MainButton.offClick(mbFn); tg.MainButton.hide(); } catch(e){} mbFn = null; }
function chrome(){
  const st = stackTop();
  const rootTab = TABS.some(t => t[0] === st.s) && stack.length === 1;
  const tb = $('#tabbar'); tb.hidden = !rootTab;
  if (rootTab) tb.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === st.s));
  try { if (tg && tg.BackButton) stack.length > 1 ? tg.BackButton.show() : tg.BackButton.hide(); } catch(e){}
  st.s === 'editor' ? setMB('СОХРАНИТЬ', saveEditor) : clearMB();
  syncMini(); }

/* ---------- рендер ---------- */
const views = { onboard:vOnboard, home:vHome, section:vSection, books:vBooks, favs:vFavs, stats:vStats, settings:vSettings, player:vPlayer, editor:vEditor };
function renderTop(dir){
  const st = stackTop();
  if (st.s === 'player' && !findLesson(st.p.id)){ history.back(); return; }
  if (curEl) scrollPos[curKey] = curEl.scrollTop;
  const el = document.getElementById('scr-' + st.s);
  document.querySelectorAll('.scr.on').forEach(x => x.classList.remove('on','fwd','bwd','pop'));
  el.innerHTML = views[st.s](st.p || {});
  el.classList.add('on', st.s === 'player' ? 'pop' : dir < 0 ? 'bwd' : 'fwd');
  curKey = st.s + ((st.p && st.p.id) || ''); curEl = el;
  el.scrollTop = scrollPos[curKey] || 0;
  if (st.s === 'player') initWave();
  if (st.s === 'home'){ const ring = $('#ring');
    if (ring) requestAnimationFrame(() => requestAnimationFrame(() => ring.style.setProperty('--p', ring.dataset.p))); }
  chrome(); }

/* ---------- тост и модалки ---------- */
let toastT = null;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); }
function modal(inner){ const m = $('#modal'); m.hidden = false;
  m.innerHTML = '<div class="m-back" data-action="m-close"></div><div class="m-card">' + inner + '</div>';
  requestAnimationFrame(() => m.classList.add('on')); }
function closeModal(){ const m = $('#modal'); m.classList.remove('on');
  if (confirmRes){ confirmRes(false); confirmRes = null; }
  setTimeout(() => { m.hidden = true; m.innerHTML = ''; }, 240); }
let confirmRes = null;
function confirmBox(title, text, ok){ return new Promise(res => { confirmRes = res;
  modal('<div class="m-ttl">' + title + '</div><p class="m-txt">' + text + '</p><div class="m-btns">' +
    '<button class="btn gh" data-action="m-no">Отмена</button><button class="btn pr" data-action="m-yes">' + (ok || 'Да') + '</button></div>'); }); }
let exportJson = '';
function exportModal(){
  exportJson = JSON.stringify({ sections: db.sections, books: db.books }, null, 1);
  modal('<div class="m-ttl">Экспорт контента</div><p class="m-txt">Это ваши разделы, подразделы, уроки и книги. Сохраните JSON, чтобы перенести контент или раздать его ученикам (см. CONTENT_URL в коде).</p>' +
    '<textarea class="ex" readonly>' + esc(exportJson) + '</textarea><div class="m-btns">' +
    '<button class="btn gh" data-action="dl-json">' + ic('dl','ic-s') + ' Файл</button>' +
    '<button class="btn pr" data-action="copy-json">Скопировать</button></div>'); }
function importModal(){
  modal('<div class="m-ttl">Импорт контента</div><p class="m-txt">Вставьте JSON. Текущие разделы и книги будут заменены, ваш прогресс сохранится.</p>' +
    '<textarea class="ex" id="imp-ta" placeholder="{ &quot;sections&quot;: [...], &quot;books&quot;: [...] }"></textarea><div class="m-btns">' +
    '<button class="btn pr" data-action="apply-import">Применить</button></div>'); }
function applyImport(){
  if (!isAdminUser()) return;
  try { const j = JSON.parse($('#imp-ta').value);
    if (!Array.isArray(j.sections)) throw 0;
    db.sections = j.sections; db.books = Array.isArray(j.books) ? j.books : [];
    normalize(); save(); closeModal(); hap('success'); toast('Контент обновлён'); rerender();
  } catch(e){ toast('Неверный формат JSON'); } }
function copyText(t){ if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('Скопировано')).catch(() => toast('Не удалось скопировать'));
  else toast('Выделите текст вручную'); }

/* ============================================================
   ОБРАБОТЧИКИ
============================================================ */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  switch (a){
    case 'start': db.settings.onboarded = true; save(); hap('medium');
      stack = [{ s:'home', p:{} }]; history.replaceState({ d:1 }, ''); renderTop(1); break;
    case 'tab': setTab(el.dataset.tab); hap(); break;
    case 'settings': go('settings'); break;
    case 'back': history.back(); break;
    case 'open-section': go('section', { id }); break;
    case 'toggle-sub': collapsedSubs.has(id) ? collapsedSubs.delete(id) : collapsedSubs.add(id); hap(); rerender(); break;
    case 'open-lesson': { const f = findLesson(id); if (!f) break;
      if (AE.cur === id){ if (AE.a.paused) AE.a.play().catch(()=>{}); }
      else AE.load(f.l, true);
      if (stackTop().s !== 'player' || stackTop().p.id !== id) go('player', { id });
      else rerender(); break; }
    case 'open-player': if (AE.cur && stackTop().s !== 'player') go('player', { id: AE.cur }); break;
    case 'fav-l': toggleArr('favL', id); hap(); save(); rerender(); break;
    case 'fav-b': toggleArr('favB', id); hap(); save(); rerender(); break;
    case 'read-b': toggleArr('readB', id); hap(); save(); rerender(); break;
    case 'open-pdf': { const b = db.books.find(x => x.id === id); if (!b) break; hap();
      try { tg && tg.openLink ? tg.openLink(b.url) : window.open(b.url, '_blank'); } catch(err){ window.open(b.url, '_blank'); } break; }
    case 'add-section': openEditor('section'); break;
    case 'add-sub': openEditor('sub', null, el.dataset.sec || (stackTop().p && stackTop().p.id)); break;
    case 'add-lesson': openEditor('lesson', null, el.dataset.sec || (stackTop().p && stackTop().p.id), el.dataset.sub || null); break;
    case 'add-book': openEditor('book'); break;
    case 'edit-section': openEditor('section', id); break;
    case 'edit-sub': openEditor('sub', id, el.dataset.sec); break;
    case 'edit-lesson': openEditor('lesson', id); break;
    case 'edit-book': openEditor('book', id); break;
    case 'p-toggle': case 'mp-toggle': AE.toggle(); break;
    case 'mp-close': AE.stop(); save(); hap(); onPlayState(); break;
    case 'p-skip': AE.skip(+el.dataset.s); hap(); break;
    case 'p-speed': { const order = [1, 1.25, 1.5, 2, 0.75];
      AE.speed = order[(order.indexOf(AE.speed) + 1) % order.length];
      AE.a.playbackRate = AE.speed; db.settings.speed = AE.speed; save(); hap();
      const sp = $('#p-speed'); if (sp) sp.innerHTML = AE.speed + '×<span>скорость</span>'; break; }
    case 'p-done': { const pid = AE.cur || (stackTop().p && stackTop().p.id); if (!pid) break;
      const pr = prOf(pid); pr && pr.done ? markDone(pid, false) : markDone(pid, true); rerender(); break; }
    case 'fav-tab': favTab = el.dataset.v; rerender(); break;
    case 'theme': db.settings.theme = el.dataset.v; save(); applyTheme(); rerender(); break;
    case 'admin-toggle': if (!isAdminUser()) break;
      db.settings.admin = !db.settings.admin; save(); hap('medium');
      toast(db.settings.admin ? 'Режим автора включён ✏️' : 'Режим автора выключен'); rerender(); break;
    case 'export': if (!isAdminUser()) break; exportModal(); break;
    case 'import': if (!isAdminUser()) break; importModal(); break;
    case 'copy-json': copyText(exportJson); break;
    case 'dl-json': { const blob = new Blob([exportJson], { type:'application/json' });
      const u = URL.createObjectURL(blob), ln = document.createElement('a');
      ln.href = u; ln.download = 'content.json'; ln.click(); URL.revokeObjectURL(u); break; }
    case 'apply-import': applyImport(); break;
    case 'reset-prog': { const ok = await confirmBox('Сбросить прогресс?', 'Отметки о прохождении, позиции и статистика будут очищены. Контент останется.', 'Сбросить');
      if (!ok) break; AE.stop(); db.progress = {}; db.days = {}; db.listenSec = 0; db.last = null;
      save(); closeModal(); toast('Прогресс сброшен'); rerender(); syncMini(); break; }
    case 'reset-all': { const ok = await confirmBox('Сбросить всё?', 'Будут удалены контент, прогресс и настройки. Приложение вернётся к начальному состоянию.', 'Сбросить всё');
      if (!ok) break; localStorage.removeItem(LS); location.reload(); break; }
    case 'm-close': closeModal(); break;
    case 'm-yes': if (confirmRes){ confirmRes(true); confirmRes = null; } closeModal(); break;
    case 'm-no': closeModal(); break;
    case 'save-editor': saveEditor(); break;
    case 'del-editor': delEditor(); break;
    case 'swatch': ED.color = el.dataset.c;
      document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('on', s.dataset.c === ED.color)); hap(); break;
    case 'emoji-q': ED.emoji = el.dataset.e;
      document.querySelector('#scr-editor [name=emoji]').value = el.dataset.e;
      document.querySelectorAll('.emojis button').forEach(b => b.classList.toggle('on', b.dataset.e === el.dataset.e)); hap(); break;
  }
});

/* ---------- внешний контент ---------- */
async function maybeRemote(){ if (!CONTENT_URL) return;
  try { const r = await fetch(CONTENT_URL, { cache:'no-store' }); const j = await r.json();
    if (Array.isArray(j.sections)){ db.sections = j.sections; db.books = j.books || [];
      normalize(); save(); rerender(); } } catch(e){} }

/* ---------- старт ---------- */
applyTheme(); buildTabbar();
AE.speed = db.settings.speed || 1;
stack = [{ s: db.settings.onboarded ? 'home' : 'onboard', p:{} }];
history.replaceState({ d:1 }, '');
renderTop(0);
maybeRemote();
</script>
